# Works with `docker compose` (values come from .env next to this file) and as a
# Portainer stack (values come from the stack's "Environment variables" section).
name: toastyb0t

services:
  toastyb0t:
    image: ghcr.io/sithtoast/toastyb0t:${TOASTYB0T_TAG:-latest}
    container_name: toastyb0t
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Inside the container the app must listen on 0.0.0.0:3000 for the port mapping to work.
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
    ports:
      # Where the dashboard is reachable on the host. The default only allows this
      # machine. Set DASHBOARD_LISTEN=3000 to allow your network, or point a reverse proxy at it.
      - "${DASHBOARD_LISTEN:-127.0.0.1:3000}:3000"
    volumes:
      - data:/app/data

volumes:
  data:
